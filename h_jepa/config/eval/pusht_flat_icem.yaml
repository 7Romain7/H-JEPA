# Push-T: flat level-1 planning with iCEM (cost-head experiments, step 1/4): CEM with
# momentum and elites kept across iterations, 3000 samples x 60 iterations (compute close to
# the GD planner of pusht_flat: 800 samples x 90 forward+backward passes).
# Same tasks, horizon, receding horizon and budget as pusht_flat (GD); only the solver changes.
# cost_head: l2 (native level-1 MSE), level2 (l2_project cost), or a head.pt path.
cache_dir: ${oc.env:HJEPA_HOME}
world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  history_size: 1
  frame_skip: 1
dataset:
  stats: pusht_expert_train
  keys_to_cache:
  - action
  - proprio
  - state
  level1:
    frameskip: 1
    num_steps: 1
seed: 42
policy: null
dump_eval_trajs_path: null
load_eval_trajs_path: assets/eval_trajs/pusht/goal_offset_75_val.pt
solver:
  _target_: stable_worldmodel.solver.CEMSolver
  model: ???
  num_samples: 3000
  n_steps: 60
  topk: 100
  momentum: 0.5
  keep_elites: 30
  var_scale: 1.0
  batch_size: 1
  device: cuda
  seed: ${seed}
plan_config:
  horizon: 15
  receding_horizon: 2
  action_block: 5
  cost_last_n: 2
eval:
  num_eval: 50
  goal_offset_steps: 75
  eval_budget: 90
  img_size: 224
  dataset_name: pusht_expert_train
  callables:
  - method: _set_state
    args:
      state:
        value: state
  - method: _set_goal_state
    args:
      goal_state:
        value: goal_state
cost_head: l2
output:
  dir: null
